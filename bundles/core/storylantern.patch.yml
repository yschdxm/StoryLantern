# 核心 bundle 的 patch：对空的 profile 根做「一次 insert」。
# 后续 bundle patch 与用户的 storylantern.patch.yml 都按 id 覆盖这些行，
# 且覆盖是**整体替换 config**（不做深合并），因此"哪一层生效"永远不含糊。
#
# 行顺序不承载加载语义：激活由依赖（inject）驱动。

- insert:
    - id: locale
      name: '@storylantern/plugin-locale'
      config:
        # 留空 = 按系统偏好自动选择；回退链保证缺翻译时仍有可读文案。
        locale: ''
        fallbacks: ['zh-CN', 'zh', 'en']
        strict: false

    - id: log-sink
      name: '@storylantern/plugin-log-sink'
      config:
        capacity: 500

    - id: settings
      name: '@storylantern/plugin-settings-store'
      config:
        namespace: app

    - id: blocks
      name: '@storylantern/plugin-context-blocks'
      config:
        maxBlocks: 64

    - id: pipeline
      name: '@storylantern/plugin-writing-pipeline'
      config:
        budgetTokens: 4096
        historyLimit: 40

    - id: sync-memory
      name: '@storylantern/plugin-sync-memory'

    # WebDAV：移动端"填个 URL 就能用"的同步方式（NAS / Nextcloud / 坚果云都自带）。
    # 只依赖全局 fetch，因此浏览器产物里也能跑。
    - id: sync-webdav
      name: '@storylantern/plugin-sync-webdav'

    # S3 兼容后端（MinIO / R2 / B2 / AWS）：同样只依赖全局 fetch；SigV4 在插件里自实现。
    - id: sync-s3
      name: '@storylantern/plugin-sync-s3'

    # 调优助手：侧信道（ADR-0003）——只产出建议，写入必须经用户批准
    - id: tuner-agent
      name: '@storylantern/plugin-tuner-agent'

    # 文件夹后端默认关闭：单机用户不需要，启用方式是在自己的 patch 里
    # 覆盖这一行为 disabled: false。
    - id: sync-folder
      name: '@storylantern/plugin-sync-folder'
      disabled: true
