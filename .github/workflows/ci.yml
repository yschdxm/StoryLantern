name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 零依赖门禁：内核/oplog/同步协议只用 Node 内置模块，因此测试不需要先安装依赖。
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 架构与体积门禁
        run: node scripts/check-boundaries.mjs
      - name: 单元与协议测试（与本地同一套范围：packages plugins apps fixtures eval）
        run: node --test --test-reporter=spec packages plugins apps fixtures eval

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
