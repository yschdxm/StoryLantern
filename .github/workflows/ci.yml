name: ci

# 门禁 / 类型 / 测试 —— 不构建任何产物，也不需要任何 secret，所以它**永远应该是绿的**。
#
# 打包（Android 与桌面）不在这里：
#  - GA 测试包：release-test.yml（**release 形态，与生产只差包名和版本号**，用生产密钥签）
#  - GA 生产包：release-prod.yml（打 v* tag）
# 原因：release 路径才包含 R8/混淆/资源压缩/剥离符号/签名/校验和 —— 用 debug 形态"验打包流程"等于没验；
# debug 形态只留在开发机上（迭代快）。分工与矩阵见 DEVELOPMENT.md。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 零依赖门禁：内核/oplog/同步协议只用 Node 内置模块，因此测试不需要先安装依赖。
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 架构与体积门禁
        run: node scripts/check-boundaries.mjs
      - name: 单元与协议测试（与本地同一套范围：packages plugins apps fixtures eval）
        # 必须用 **glob**：`node --test <目录>` 在 runner 上会把目录当模块去 require
        # （实测报 Cannot find module '.../apps'），本地我用的就是 glob 形式。
        run: node --test --test-reporter=spec "packages/**/*.test.ts" "apps/**/*.test.ts" "plugins/**/*.test.ts" "fixtures/**/*.test.ts" "eval/**/*.test.ts"

      - name: 性能预算（只有真越线才红；int8 与世界书扫描在 CI 上标 INFO，不参与判定）
        run: npm run perf

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
