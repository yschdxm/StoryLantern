name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 零依赖门禁：内核/oplog/同步协议只用 Node 内置模块，因此测试不需要先安装依赖。
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 架构与体积门禁
        run: node scripts/check-boundaries.mjs
      - name: 单元与协议测试（与本地同一套范围：packages plugins apps fixtures eval）
        run: node --test --test-reporter=spec packages plugins apps fixtures eval

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck

  # Android：只跑**测试渠道的 debug 包**（`app.storylantern.test`，测试密钥签）—— 不需要任何 secret，
  # 这是"机器行为可验证"的那一半。用**生产密钥**签名（测试身份 / 生产身份）的包在
  # release-test.yml 与 release-prod.yml 里，身份与密钥的分工见 docs/PACKAGING.md。
  #
  # 两件 CI 上必须自己造的东西（都被 gitignore，干净 checkout 里没有）：
  #  1. `apps/shell/src-tauri/gen/android` —— Tauri 生成物，先 `tauri android init --ci`；
  #  2. 测试密钥 —— 口令就是仓库文档里那串公开值，用脚本现场生成，不涉及真正的秘密。
  #
  # 如实：这个 job 是**照着本机验证过的命令写的**（本机是 Windows，我跑的是同一组命令）；
  # Linux runner 上的差异（NDK 的 linux-x86_64 工具链、`./gradlew`、JAVA_HOME）已按平台分支写好，
  # 但**没有在真 runner 上跑过**，第一次 CI 运行才算验证。
  android:
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Rust + Android 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Android SDK 与 NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;27.3.13750724'

      - run: pnpm install --no-frozen-lockfile

      - name: 生成 Android 工程（gen/ 被 gitignore，干净 checkout 里没有）
        working-directory: apps/shell
        run: pnpm exec tauri android init --ci --skip-targets-install

      - name: 造测试密钥（口令是仓库文档里那串公开值，不是秘密）
        run: node scripts/make-android-keystore.mjs --channel=test

      - name: 构建测试渠道 debug APK —— 不需要任何 secret
        # 不能加 --skip-frontend：干净 checkout 里没有 apps/app/dist，而 Tauri 要把前端产物编进 .so
        env:
          NDK_VERSION: '27.3.13750724'
        run: node scripts/build-android.mjs --channel=test --abi=arm64

      - name: 发布校验和（产物 + SHA256SUMS；有 GnuPG 时还会签名）
        run: node scripts/release-checksums.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: storylantern-android-test
          path: |
            .apk-out/storylantern-test-*.apk
            .apk-out/build-info.json
            release/SHA256SUMS*
          if-no-files-found: error
