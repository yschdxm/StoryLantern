[package]
name = "storylantern-shell"
version = "0.0.1"
description = "Story Lantern 原生壳（Tauri v2）"
edition = "2021"
rust-version = "1.77"

# 移动端需要 staticlib/cdylib，桌面需要 rlib。
[lib]
name = "storylantern_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# base64：宿主侧通用 HTTP 转发要在 JSON 里搬运二进制请求体/响应体
base64 = "0.22"
# bundled：把 SQLite 源码一起编进来，不依赖系统 sqlite（Android 上没有可链接的系统 sqlite）
rusqlite = { version = "0.37", features = ["bundled"] }
# 模型调用在宿主侧进行：密钥只落在宿主数据库里，前端拿不到也进不了日志
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[features]
# 由 tauri 官方模板约定：custom-protocol 用于生产构建
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 移动端包体直接受这个影响：不 strip 的话 .so 会从 ~9MB 涨到 ~19MB（APK 16MB → 26MB）。
# `tauri android build` 自己会 strip，我们手动调 cargo 时得显式写上。
strip = "symbols"
# 待评估（需要设备上重新验证后才引入）：panic = "abort" 与 lto = true 能再省体积，
# 但前者改动 panic 语义，不测过不上。
